<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-WHBH9CQXNT"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-WHBH9CQXNT');
  </script>
  
  <!-- Primary Meta Tags -->
  <title>Live Examples - TypeOwl</title>
  <meta name="title" content="Live Examples - TypeOwl">
  <meta name="description" content="Interactive examples showing TypeOwl's type synchronization in action. Test API endpoints with full type safety.">
  <meta name="robots" content="index, follow">
  
  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://typeowl.dev/examples/">
  <meta property="og:title" content="Live Examples - TypeOwl">
  <meta property="og:description" content="Interactive examples showing TypeOwl's type synchronization in action.">
  <meta property="og:image" content="/typeOwl.logo.png">
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/owl.svg">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-primary: #0a0a0b;
      --bg-secondary: #111113;
      --bg-tertiary: #1a1a1d;
      --bg-card: #16161a;
      --text-primary: #fffffe;
      --text-secondary: #94a1b2;
      --text-muted: #72757e;
      --accent: #f59e0b;
      --accent-glow: rgba(245, 158, 11, 0.15);
      --accent-hover: #fbbf24;
      --success: #10b981;
      --error: #ef4444;
      --border: #2e2e32;
      --radius: 16px;
      --radius-sm: 8px;
      --font-sans: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-sans);
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.7;
      min-height: 100vh;
    }

    #root {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Navigation - matches other pages */
    .site-nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      padding: 1rem 2rem;
      background: rgba(10, 10, 11, 0.9);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }

    .nav-content {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: var(--text-primary);
      font-weight: 600;
      font-size: 1.25rem;
    }

    .nav-logo img { width: 36px; height: 36px; }

    .nav-links {
      display: flex;
      gap: 2rem;
      list-style: none;
    }

    .nav-links a {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      transition: color 0.2s;
    }

    .nav-links a:hover, .nav-links a.active { color: var(--accent); }

    button {
      cursor: pointer;
      font-family: inherit;
    }

    code {
      font-family: var(--font-mono);
      background: var(--bg-tertiary);
      padding: 0.2em 0.4em;
      border-radius: 4px;
      font-size: 0.9em;
    }

    @media (max-width: 768px) {
      .site-nav { padding: 1rem; }
      .nav-links { display: none; }
    }
  </style>
</head>
<body>
  <!-- Site Navigation -->
  <nav class="site-nav">
    <div class="nav-content">
      <a href="/" class="nav-logo">
        <img src="/typeOwl.logo.png" alt="TypeOwl">
        <span>TypeOwl</span>
      </a>
      <ul class="nav-links">
        <li><a href="/docs/index.html">Documentation</a></li>
        <li><a href="/engine/index.html">How It Works</a></li>
        <li><a href="/examples.html" class="active">Examples</a></li>
        <li><a href="https://github.com/typeowl/typeowl" target="_blank">GitHub</a></li>
      </ul>
    </div>
  </nav>

  <!-- React App Mount Point -->
  <div id="root"></div>
  
  <!-- Load the React App -->
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
